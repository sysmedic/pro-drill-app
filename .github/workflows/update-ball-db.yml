name: Weekly Bowling Ball DB Auto-Update

on:
  schedule:
    - cron: '0 15 * * 5' # 매주 금요일 한국시간 24:00 (UTC 15:00)
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests beautifulsoup4 pydantic
      - run: python scripts/generate_ball_db.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/bowling_balls.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update bowling ball DB" && git push)
